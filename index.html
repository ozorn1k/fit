<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Фитнес</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ============ ТРЕНИРОВКИ ============ -->
  <section class="screen on" id="sc-train">
    <div class="head">
      <div>
        <h1>Тренировки</h1>
        <div class="sub" id="tr-sub">—</div>
      </div>
      <button class="btn sm sec" id="btn-import">Вставить</button>
    </div>
    <div id="tr-body"></div>
  </section>

  <!-- ============ ЕДА ============ -->
  <section class="screen" id="sc-food">
    <div class="head">
      <div>
        <h1>Питание</h1>
        <div class="sub" id="fd-sub">—</div>
      </div>
      <button class="btn sm sec" id="fd-datebtn">Сегодня</button>
    </div>
    <div id="fd-body"></div>
  </section>

  <!-- ============ ЗАМЕТКИ ============ -->
  <section class="screen" id="sc-notes">
    <div class="head">
      <div>
        <h1>Заметки</h1>
        <div class="sub" id="nt-sub">—</div>
      </div>
      <button class="btn sm sec" id="nt-add">Добавить</button>
    </div>
    <div id="nt-body"></div>
  </section>

  <!-- ============ ЕЩЁ ============ -->
  <section class="screen" id="sc-more">
    <div class="head">
      <div>
        <h1>Профиль</h1>
        <div class="sub" id="mr-sub">—</div>
      </div>
    </div>
    <div id="mr-body"></div>
  </section>

  <nav id="tabs">
    <button data-tab="train" class="on">
      <svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/></svg>
      <span>Тренировки</span>
    </button>
    <button data-tab="food">
      <svg viewBox="0 0 24 24"><path d="M5 3v8a3 3 0 006 0V3M8 11v10M19 3c-1.5 2-2 4-2 6s.5 3 2 3v9"/></svg>
      <span>Питание</span>
    </button>
    <button data-tab="notes">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l4 4v12H5z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg>
      <span>Заметки</span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c.9-3.7 3.9-5.6 7.5-5.6s6.6 1.9 7.5 5.6"/></svg>
      <span>Профиль</span>
    </button>
  </nav>
</div>

<!-- ============ SHEETS ============ -->
<div class="sheet" id="sheet"><div class="bd" data-close></div><div class="pn"><div class="grab"></div><div id="sheet-c"></div></div></div>
<div class="sheet" id="sheet2"><div class="bd" data-close2></div><div class="pn"><div class="grab"></div><div id="sheet2-c"></div></div></div>

<div id="toast"></div>
<div class="pr-flash" id="prflash"></div>
<canvas id="shot"></canvas>

<script src="js/store.js"></script>
<script src="js/food-db.js"></script>
<script src="js/parser.js"></script>
<script src="js/workouts.js"></script>
<script src="js/food.js"></script>
<script src="js/food-plus.js"></script>
<script src="js/notes.js"></script>
<script src="js/stats.js"></script>
<script src="js/timer.js"></script>
<script src="js/report.js"></script>
<script src="js/main.js"></script>
</body>
</html>
